<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="نوورا | فروشگاه لوکس تکنولوژی و گجت‌های دیجیتال"
    />
    <title>نوورا | فروشگاه لوکس تکنولوژی</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // جلوگیری از فلش تم: تم ذخیره‌شده را قبل از رندر ری‌اکت روی <html> اعمال می‌کند
      ;(function () {
        try {
          var stored = localStorage.getItem("nuvora-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (stored === "dark" || (!stored && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // اینترو: قفل اسکرول و پنهان‌کردن محتوای سایت قبل از اولین رندر،
      // مگر وقتی کاربر حرکت کمتر را ترجیح می‌دهد (کامپوننت DianIntro کلاس را برمی‌دارد)
      if (!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) {
        document.documentElement.classList.add("dian-intro-playing");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
